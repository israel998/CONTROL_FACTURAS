<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sistema de Control de Compras & Facturas</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- jsPDF & AutoTable para reportes contables -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .glass-card { background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-16">

  <!-- BARRA DE NAVEGACIÓN -->
  <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
      <div class="flex items-center gap-2">
        <div class="p-2 bg-indigo-600 rounded-lg text-white">
          <i data-lucide="receipt" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight">Control de Compras</h1>
          <p class="text-xs text-slate-400">Captura IA + Respaldo Google Drive 5TB</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="abrirModalReporte()" class="flex items-center gap-1.5 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg text-xs font-semibold transition">
          <i data-lucide="file-text" class="w-4 h-4 text-emerald-400"></i>
          <span>Reporte PDF</span>
        </button>
        <button onclick="abrirModalConfig()" class="flex items-center gap-1.5 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg text-xs font-semibold transition">
          <i data-lucide="settings" class="w-4 h-4 text-amber-400"></i>
          <span>Configuración</span>
        </button>
      </div>
    </div>
  </header>

  <!-- CONTENEDOR PRINCIPAL -->
